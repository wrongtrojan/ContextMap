version: "3.8"

services:
  postgres:
    container_name: contextmap-postgres
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: contextmap
      POSTGRES_PASSWORD: contextmap
      POSTGRES_DB: contextmap
    ports:
      - "5432:5432"
    volumes:
      - ../storage/db_data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextmap -d contextmap"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    container_name: contextmap-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: contextmap
      MINIO_ROOT_PASSWORD: contextmap123
    volumes:
      - ../storage/db_data/minio:/data
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    container_name: contextmap-adminer
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    name: contextmap_network
